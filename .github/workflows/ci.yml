name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Rps.Api/Rps.Api.sln

      # Disable global nuget source warning if not needed, otherwise build
    - name: Build
      run: dotnet build Rps.Api/Rps.Api.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test Rps.Api/Rps.Api.sln --configuration Release --no-build --verbosity normal
